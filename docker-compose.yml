services:
  db:
    image: pgvector/pgvector:pg16
    container_name: aperture-db
    # pg_stat_statements has to be preloaded at startup; it cannot be switched on
    # in a running server. Kept on permanently so a slow query can be attributed
    # after the fact rather than only while someone is watching.
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.max=5000
      -c pg_stat_statements.track=all
    environment:
      POSTGRES_USER: aperture
      POSTGRES_PASSWORD: aperture
      POSTGRES_DB: aperture
    ports:
      # 5432 = native Postgres, 5433 = VaultKeeper, 5434 = Buddy on this machine
      - "127.0.0.1:5435:5432"
    volumes:
      - aperture_pgdata:/var/lib/postgresql/data
      - ./scripts/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aperture -d aperture"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  aperture_pgdata:
